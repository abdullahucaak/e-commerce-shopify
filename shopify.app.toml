# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "13596191c374b990782dcd56317f49a5"
name = "GlowField Commerce"
application_url = "https://localhost:3458"
embedded = false

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled", "shop/update", "domains/create", "domains/update", "domains/destroy" ]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "/api/shopify/webhooks"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "unauthenticated_write_checkouts,unauthenticated_read_checkouts,unauthenticated_read_product_inventory,unauthenticated_read_product_listings,unauthenticated_read_product_tags"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://localhost:3458/api/shopify/callback" ]

[build]
automatically_update_urls_on_dev = true
